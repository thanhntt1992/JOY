<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="joyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF4B2B" />
      <stop offset="50%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#8A2387" />
    </linearGradient>
    <style>
      .brand-joy-text { fill: #0F172A; }
      .brand-sub-text { fill: #64748B; }
      @media (prefers-color-scheme: dark) {
        .brand-joy-text { fill: #FFFFFF; }
        .brand-sub-text { fill: #94A3B8; }
      }
    </style>
  </defs>
  <!-- Gamepad / Joy Icon -->
  <g transform="translate(10, 10)">
    <rect x="0" y="5" width="70" height="70" rx="20" fill="url(#joyGrad)" />
    <!-- D-pad -->
    <path d="M23 40h24M35 28v24" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Joy Buttons -->
    <circle cx="50" cy="32" r="3.5" fill="#ffffff" />
    <circle cx="56" cy="40" r="3.5" fill="#FFE600" />
    <!-- Sparkle accent -->
    <path d="M54 18L56 12L58 18L64 20L58 22L56 28L54 22L48 20Z" fill="#FFE600"/>
  </g>
  <!-- Text Brand -->
  <text x="95" y="52" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" class="brand-joy-text" letter-spacing="-0.5">
    JOY<tspan fill="#FF4B2B">GAMES</tspan>
  </text>
  <rect x="290" y="28" width="115" height="26" rx="6" fill="rgba(255, 75, 43, 0.18)" stroke="#FF4B2B" stroke-width="1.2"/>
  <text x="347" y="45" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#FF5E3A" text-anchor="middle" letter-spacing="1.5">
    HR PORTAL
  </text>
  <text x="96" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="500" font-size="12" class="brand-sub-text" letter-spacing="0.8">
    HỆ THỐNG QUẢN LÝ &amp; LƯU TRỮ HỒ SƠ NHÂN SỰ
  </text>
</svg>
